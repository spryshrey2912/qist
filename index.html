<style>
:root{--paper:#f4efe4;--card:#fffdf8;--ink:#14261e;--mut:#5b675f;--line:#e0d8c6;--deep:#1e3b2f;--sand:#c8b48a;--cream:#f5f0e6;--green:#0f5b4a;--green2:#e1efe8;--red:#d52b42;--red2:#fdecee;--amber:#8f6200;--amber2:#fff3d2;--shadow:0 1px 2px rgba(14,31,25,.06),0 10px 28px -14px rgba(14,31,25,.22);--head:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;--body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:lang(ar) body{line-height:1.85}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
a,button,label.btn,textarea{outline-offset:3px}
:focus-visible{outline:3px solid var(--green)}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.brand{display:flex;align-items:center;gap:11px;font:600 23px/1 var(--head);letter-spacing:-.015em}
.brand small{font-weight:500;color:var(--mut);font-size:20px;letter-spacing:0}
.brand svg{width:40px;height:40px;filter:drop-shadow(0 4px 8px rgba(15,91,74,.25))}
button,.btn{font:600 16px/1.3 var(--head);border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 18px;cursor:pointer;transition:background .15s,border-color .15s,transform .08s,box-shadow .15s}
button:hover,.btn:hover{border-color:var(--green);background:#fbfdfc}
button:active,.btn:active{transform:translateY(1px)}
button.primary{background:var(--green);border-color:var(--green);color:#fff;padding:14px 30px;font-size:18px;box-shadow:0 8px 18px -8px rgba(15,91,74,.65)}
button.primary:hover{background:#0a4a3b;border-color:#0a4a3b;transform:translateY(-1px)}
button.primary:active{transform:translateY(1px)}
button:disabled{opacity:.55;cursor:wait}
.hero{position:relative;overflow:hidden;background:var(--deep);color:var(--cream);border-radius:32px;padding:46px 42px 40px;margin:6px 0 0}
.hero::after{content:"";position:absolute;inset-inline-end:-96px;top:-96px;width:320px;height:320px;border-radius:50%;border:46px solid rgba(200,180,138,.14);pointer-events:none}
.hero>*{position:relative;z-index:1;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.hero>:nth-child(2){animation-delay:.08s}.hero>:nth-child(3){animation-delay:.16s}.hero>:nth-child(4){animation-delay:.24s}
.hero h1{font:600 clamp(38px,7vw,68px)/1.04 var(--head);letter-spacing:-.035em;margin:0 0 16px;max-width:12em;text-wrap:balance;color:var(--cream)}
.hero p{color:#d2d2c1;max-width:33em;margin:0 0 28px;font-size:18px}
.demo{display:inline-flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:rgba(245,240,230,.07);border:1.5px solid rgba(245,240,230,.2);border-radius:20px;padding:12px 14px 12px 20px;font-weight:600;margin-bottom:22px}
:lang(ar) .demo{padding:12px 20px 12px 14px}
.demo .big{font:600 34px/1 var(--head);font-variant-numeric:tabular-nums;color:var(--sand);letter-spacing:-.03em}
.demo .fee{background:var(--sand);color:var(--deep);border-radius:12px;padding:6px 13px;font-family:var(--head);font-size:16px}
.demo .mut{color:#d2d2c1}
.cmp{max-width:30em}
.cmp .r{display:flex;align-items:center;height:32px;margin-top:10px;font:600 14px/1 var(--head);font-variant-numeric:tabular-nums;direction:ltr}
.cmp .r span{display:flex;align-items:center;height:100%;padding:0 12px;border-radius:8px}
.cmp .a span{width:74%;background:#7f8c6a;color:var(--cream)}
.cmp .b span:first-child{width:74%;background:var(--cream);color:var(--deep);border-radius:8px 0 0 8px}
.cmp .b span:last-child{width:12.6%;background:var(--sand);color:var(--deep);border-radius:0 8px 8px 0;justify-content:center;padding:0}
:lang(ar) .cmp{margin-inline-start:0}
.tool{background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:24px;margin:22px 0 26px;box-shadow:0 22px 44px -26px rgba(20,38,30,.4)}
textarea{width:100%;min-height:170px;resize:vertical;border:1.5px solid var(--line);border-radius:16px;padding:16px;font:inherit;font-size:17px;line-height:1.55;background:#fbf8f1;color:var(--ink);transition:border-color .15s,box-shadow .15s}
textarea::placeholder{color:#8a968f}
textarea:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 4px var(--green2);background:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;align-items:center}
.row .lbl{color:var(--mut);font-size:15px;margin-inline-end:4px}
.chip{padding:7px 14px;font:500 15px/1.3 var(--body);border-radius:999px;background:var(--paper);border-color:transparent}
.chip:hover{background:var(--green2);border-color:var(--green)}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:8px}
#status{min-height:1.6em;margin:14px 2px 0;color:var(--mut);font-size:15px}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:40%;background:var(--green);border-radius:4px;animation:slide 1.2s ease-in-out infinite}
.bar.done{display:none}
@keyframes slide{0%{margin-inline-start:-40%}100%{margin-inline-start:100%}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#out>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
#out>:nth-child(2){animation-delay:.06s}#out>:nth-child(3){animation-delay:.12s}#out>:nth-child(n+4){animation-delay:.18s}
@media (prefers-reduced-motion:reduce){.cmp .r span,.cmp .b span:last-child,.demo .fee::after,.verdict::before,.verdict .hf{animation:none!important}.chip:hover,.stat:hover{transform:none}[data-tip]::after{transition:none}.hero>*{animation:none}.bar i{animation:none;width:100%}html{scroll-behavior:auto}#out>*{animation:none}button{transition:none}}
.verdict{position:relative;border-radius:22px;padding:22px 24px 22px 74px;border:1.5px solid;box-shadow:var(--shadow)}
:lang(ar) .verdict{padding:22px 74px 22px 24px}
.verdict::before{content:"!";position:absolute;inset-inline-start:20px;top:22px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:#fff}
.verdict h2{margin:0;font:600 clamp(21px,4vw,29px)/1.3 var(--head);letter-spacing:-.015em}
.verdict.warning{background:var(--red2);border-color:#f0a5af} .verdict.warning h2{color:#a1172b} .verdict.warning::before{background:var(--red)}
.verdict.watch{background:var(--amber2);border-color:#e5c25e} .verdict.watch h2{color:var(--amber)} .verdict.watch::before{background:#c28a00}
.verdict.clear{background:var(--green2);border-color:#9cc9b6} .verdict.clear h2{color:var(--green)} .verdict.clear::before{content:"\2713";background:var(--green)}
.verdict .hf{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:12px;background:#fff;color:var(--red);font:600 20px/1.3 var(--head);font-variant-numeric:tabular-nums;box-shadow:0 1px 0 rgba(213,43,66,.18)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.stat b{display:block;font:600 30px/1.15 var(--body);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.02em}
.stat span{display:block;margin-top:4px;color:var(--mut);font-size:15px}
.stat.hot{background:var(--red2);border-color:#f0c2c8}
.stat.hot b{color:var(--red)}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px 20px;margin:14px 0;box-shadow:var(--shadow)}
.panel h3{margin:0 0 10px;font:600 18px/1.3 var(--head)}
.panel p{margin:.5em 0}
table{width:100%;border-collapse:collapse}
td{padding:9px 0;border-bottom:1px dashed var(--line)}
tr:last-child td{border-bottom:0}
td:first-child{color:var(--mut)}
td:last-child{text-align:end;font-weight:600;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:15px}
footer{color:var(--mut);font-size:14px;padding:10px 0 56px;max-width:46em}
strong{font-weight:700}
:lang(ar) .hero h1,:lang(ar) .verdict h2,:lang(ar) .brand,:lang(ar) .stat b,:lang(ar) .demo .big{letter-spacing:0}
/* motion and tooltips */
html{scroll-padding-top:16px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.88)}60%{transform:scale(1.04)}100%{opacity:1;transform:none}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(var(--vc),.45)}100%{box-shadow:0 0 0 18px rgba(var(--vc),0)}}
@keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
.cmp .r span{transform-origin:left center;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.cmp .a span{animation-delay:.55s}.cmp .b span:first-child{animation-delay:.7s}.cmp .b span:last-child{animation:pop .5s cubic-bezier(.2,.7,.2,1) 1.45s both}
.demo .fee{position:relative;overflow:hidden}
.demo .fee::after,button.primary::before{content:"";position:absolute;inset:0;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-120%);pointer-events:none}
.demo .fee::after{animation:sweep 1.1s ease-in-out 1.9s 1 both}
.demo:hover .fee::after{animation:sweep .9s ease-in-out}
button.primary{position:relative;overflow:hidden}
button.primary:hover::before{animation:sweep .8s ease-in-out}
.chip{transition:background .15s,border-color .15s,transform .15s}
.chip:hover{transform:translateY(-2px)}
.stat{transition:transform .2s,box-shadow .2s;position:relative}
.stat:hover,.stat:focus-visible{transform:translateY(-2px);box-shadow:0 14px 26px -16px rgba(20,38,30,.35)}
.tool{transition:border-color .2s,box-shadow .2s}
.tool:focus-within{border-color:var(--green);box-shadow:0 26px 50px -26px rgba(15,91,74,.45)}
.verdict.warning{--vc:213,43,66}.verdict.watch{--vc:194,138,0}.verdict.clear{--vc:15,91,74}
.verdict::before{animation:ring 1.3s ease-out .35s 1 both}
.verdict .hf{animation:pop .5s cubic-bezier(.2,.7,.2,1) .45s both}
[data-tip]{cursor:help}
.stat[data-tip] span::after{content:"\00a0\24d8";color:var(--green);opacity:.7}
[data-tip]::after{content:attr(data-tip);position:absolute;inset-inline:0;bottom:calc(100% + 8px);width:max-content;max-width:min(300px,86vw);background:var(--deep);color:var(--cream);padding:10px 13px;border-radius:12px;font:400 14px/1.5 var(--body);letter-spacing:0;text-align:start;opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .18s,transform .18s,visibility .18s;pointer-events:none;z-index:10;box-shadow:0 14px 28px -12px rgba(20,38,30,.5)}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;visibility:visible;transform:none}
.verdict .hf[data-tip],#photoLbl[data-tip]{position:relative}
.verdict .hf[data-tip]::after{inset-inline:auto 0}
.stat[data-tip]:hover span::after,.stat[data-tip]:focus-visible span::after{opacity:1}
@media (max-width:520px){.hero{padding:30px 22px 26px;border-radius:26px}.hero::after{width:220px;height:220px;border-width:32px;inset-inline-end:-70px;top:-70px}.wrap{padding:0 16px}.tool{padding:16px;border-radius:22px}.verdict{padding:20px 18px 20px 66px}:lang(ar) .verdict{padding:20px 66px 20px 18px}.verdict::before{inset-inline-start:16px;top:20px}button.primary{width:100%}.actions .btn{flex:1;text-align:center}}

.tool,.stat,.panel{background:rgba(255,253,248,.62);border-color:rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 18px 40px -22px rgba(20,38,30,.35)}

.stat{background:rgba(255,253,248,.55)}
.chip,#langBtn,button:not(.primary){background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.chip:hover,#langBtn:hover{background:rgba(255,255,255,.8)}
.demo{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
textarea{background:rgba(255,255,255,.5);border-color:rgba(255,255,255,.8)}
.hero{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 28px 50px -28px rgba(20,38,30,.55)}
.wrap>*:not(nav){transition:opacity .18s ease,transform .18s ease,filter .18s ease}
.wrap.swap>*:not(nav){opacity:0;transform:translateY(6px);filter:blur(4px)}
@media (prefers-reduced-motion:reduce){.wrap>*:not(nav){transition:none}.wrap.swap>*:not(nav){transform:none;filter:none}}

/* hero tilt */
.hero{--rx:0deg;--ry:0deg;--s:1;--gx:50%;--gy:30%;--ga:0;transform:perspective(1000px) rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--s));transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1),box-shadow .55s;will-change:transform}
.hero.tilt{transition:transform .1s ease-out,box-shadow .3s;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 46px 70px -26px rgba(20,38,30,.7)}
.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:var(--ga);transition:opacity .3s;background:radial-gradient(420px circle at var(--gx) var(--gy),rgba(255,255,255,.16),transparent 65%)}
@media (prefers-reduced-motion:reduce),(hover:none){.hero{transform:none!important}.hero::before{display:none}}



.gl{margin:2px 2px 14px;font:400 16px/1.5 "Libre Baskerville","Palatino Linotype",Georgia,"Times New Roman",serif;color:var(--mut);max-width:36em}
.gl b{display:block;font-weight:400;font-size:17px;color:var(--ink);margin-bottom:2px}
.gl b em{font-style:italic;color:var(--mut)}
:lang(ar) .en,:lang(en) .ar{display:none}
.hd{display:flex;flex-direction:column;gap:6px}.hd .gl{margin:0 0 0 2px}nav{align-items:flex-start}
</style>

  <div class="hd"><div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#0f5b4a"/><circle cx="30" cy="29" r="15" fill="none" stroke="#fff" stroke-width="6"/><rect x="22" y="30" width="5" height="8" rx="1.5" fill="#ff9aa7"/><rect x="29" y="25" width="5" height="13" rx="1.5" fill="#ff9aa7"/><rect x="36" y="20" width="5" height="18" rx="1.5" fill="#ff9aa7"/><path d="M41 40l11 11" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>Qist <small>قسط</small></div><p class="gl"><b><span style="font-weight:400">/ kɪst /</span> <em>noun</em> &middot; قسط</b><span class="en">A smarter way to understand the real cost of things.</span><span class="ar">طريقة أذكى لفهم التكلفة الحقيقية للأشياء.</span></p></div>

       nocost:"تعذّر حساب التكلفة: لا يذكر العرض سعراً أو عدد أقساط.", example:"لا يوجد سعر في العرض: استُخدم سعر مثال.", feeup:a => `افتراض: الرسوم المقدمة المحتسبة في هذا الحساب (${a} ريال، للخطة المستخدمة أعلاه) تُدفع في اليوم الأول وبشكل منفصل عن الأقساط الشهرية، فتُحسب كمبلغ لا تستلمه. لا يذكر العرض موعد تحصيلها.`,
       found:"ما وُجد في العرض", prod:"يبدو أنه", price:"السعر النقدي", n:"الأقساط", fee:"الرسم", rate:"نسبة الربح", late:"غرامة التأخير",
       foot:"قسط يوضح ما يجب التحقق منه. لا يحكم بقانونية العرض وليس نصيحة مالية. كل عرض مصنَّف وفق قاعدة مكتوبة واحدة."}
};
let lang = "en", py = null, samples = {}, busy = false, lastResult = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const fmt = x => (x == null ? "-" : Number(x).toLocaleString("en", {maximumFractionDigits: 2}));
const status = (t, load) => { $("status").textContent = t || ""; $("bar").className = "bar" + (load ? "" : " done"); };

function applyLang() {
  const t = S[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("langBtn").textContent = lang === "ar" ? "English" : "العربية";
  $("h1").textContent = t.h1; $("d1").textContent = t.d1; $("d2").textContent = t.d2; $("sub").textContent = t.sub; $("txt").placeholder = t.ph; $("go").textContent = t.go;
  $("photoTxt").textContent = "📷 " + t.photo; $("foot").textContent = t.foot;
  const box = $("samples"); box.innerHTML = "<span class='lbl'></span>"; box.firstChild.textContent = t.sample;
  for (const k of Object.keys(samples)) {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = t.samples[k] || k;
    b.onclick = () => { $("txt").value = samples[k]; }; box.appendChild(b);
  }
  if (lastResult) render(lastResult.r);
}

async function fetchText(p) { const r = await fetch(p); if (!r.ok) throw new Error(p + " " + r.status); return r.text(); }

async function boot() {
  try {
    samples = JSON.parse(await fetchText("content/samples.json")); applyLang();
    status(S[lang].l1, 1);
    py = await loadPyodide();
    status(S[lang].l2, 1);
    const files = ["app/engine.py", "app/cost.py", "app/analyze.py", "app/ml.py", "model/rules.py", "model/wording_model.json"];
    for (const d of ["/home/pyodide/app", "/home/pyodide/model"]) py.FS.mkdirTree(d);
    for (const f of files) py.FS.writeFile("/home/pyodide/" + f, await fetchText(f));
    status(S[lang].l3, 1); await new Promise(r => setTimeout(r, 30));
    await py.runPythonAsync("import sys, json\nsys.path.insert(0,'/home/pyodide/app')\nimport analyze, ml\nassert ml.saved() is not None");
    status(S[lang].ready); $("go").disabled = false;
  } catch (e) { status(S[lang].fail + e.message); console.error(e); }
}

function analyse(text) {
  py.globals.set("_t", text); py.globals.set("_l", lang);
  return JSON.parse(py.runPython("json.dumps(analyze.analyze(_t,_l))"));
}

let ocrWorker = null;
async function readPhoto(file) {
  if (!window.Tesseract) throw new Error("text reader not loaded");
  const bmp = await createImageBitmap(file), W = 1300, H = Math.round(bmp.height * W / bmp.width);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const cx = cv.getContext("2d", {willReadFrequently: true}); cx.drawImage(bmp, 0, 0, W, H);
  const im = cx.getImageData(0, 0, W, H), d = im.data; let lo = 255, hi = 0;
  for (let i = 0; i < d.length; i += 4) { const v = .299 * d[i] + .587 * d[i+1] + .114 * d[i+2]; d[i] = v; if (v < lo) lo = v; if (v > hi) hi = v; }
  const k = hi > lo ? 255 / (hi - lo) : 1;
  for (let i = 0; i < d.length; i += 4) { const v = (d[i] - lo) * k; d[i] = d[i+1] = d[i+2] = v; }
  cx.putImageData(im, 0, 0);
  status(S[lang].loadocr, 1);
  if (!ocrWorker) { ocrWorker = await Tesseract.createWorker("ara+eng"); await ocrWorker.setParameters({tessedit_pageseg_mode: "6"}); }
  status(S[lang].reading, 1);
  let best = await ocrWorker.recognize(cv);
  if (best.data.confidence < 60) {                                   // weak read: one black-and-white retry, keep the better
    for (let i = 0; i < d.length; i += 4) { const v = d[i] > 150 ? 255 : 0; d[i] = d[i+1] = d[i+2] = v; }
    cx.putImageData(im, 0, 0);
    const bw = await ocrWorker.recognize(cv); if (bw.data.confidence > best.data.confidence) best = bw;
  }
  return best.data.text.trim();
}

function render(r) {
  const t = S[lang], v = r.verdict.level, o = [], c = r.cost, tm = r.terms;
  o.push(`<div class="verdict ${v}"><h2>${esc(t.v[v])}</h2>${r.hidden_fee ? `<div class="hf">${esc(t.hid(fmt(r.hidden_fee.amount), r.hidden_fee.currency))}</div>` : ""}</div>`);
  if (c) {
    o.push(`<div class="grid">
      <div class="stat"><b>${fmt(c.total_paid)}</b><span>${esc(t.total)}</span></div>
      <div class="stat hot"><b>+${fmt(c.extra_cost)}</b><span>${esc(t.extra)}</span></div>
      <div class="stat"><b>${fmt(c.effective_annual_rate)}%</b><span>${esc(t.ear)}</span></div>
      <div class="stat"><b>${fmt(c.instalment)}</b><span>${esc(t.inst)}</span></div></div>
      <p class="mut">${esc(t.ctitle)} \u00b7 ${esc(t.how)}: ${esc(c.how)}${r.terms.price_is_example ? " \u00b7 " + esc(t.example) : ""}</p>
      ${c.fee_total > 0 ? `<p class="mut">${esc(t.feeup(fmt(c.fee_total)))}</p>` : ""}
      ${(c.warnings || []).map(w => `<p class="mut">${esc(w)}</p>`).join("")}`);
  } else o.push(`<div class="panel mut">${esc(t.nocost)}</div>`);
  if (r.flags.length) o.push(`<div class="panel">${r.flags.map(f => `<p>${md(f.message)}</p>`).join("")}</div>`);
  else if (r.message_if_no_flag) o.push(`<div class="panel"><p>${md(r.message_if_no_flag)}</p></div>`);
  o.push(`<div class="panel"><h3>${esc(t.found)}</h3><table>
    <tr><td>${esc(t.prod)}</td><td>${esc(r.product_name)}</td></tr>
    <tr><td>${esc(t.price)}</td><td>${fmt(tm.cash_price)}</td></tr>
    <tr><td>${esc(t.n)}</td><td>${fmt(tm.n_installments)}</td></tr>
    <tr><td>${esc(t.rate)}</td><td>${fmt(tm.profit_rate)}%</td></tr>
    <tr><td>${esc(t.fee)}</td><td>${fmt(tm.admin_fee)}</td></tr>
    <tr><td>${esc(t.late)}</td><td>${fmt(tm.late_fee)}</td></tr></table></div>`);
  if (r.ml_p_misleading != null) o.push(`<div class="panel mut">${esc(t.model)}: ${Math.round(r.ml_p_misleading * 100)}% \u00b7 ${esc(t.agree[r.verdict.model_agrees ? 0 : 1])}</div>`);
  o.push(`<div class="panel mut"><p>${esc(r.sama)}</p><p>${esc(r.disclaimer)}</p></div>`);
  $("out").innerHTML = o.join("");
}

async function run(text) {
  if (!py || busy) return; busy = true; $("go").disabled = true;
  try {
    if (!text.trim()) { status(S[lang].empty); return; }
    status(S[lang].analysing, 1); await new Promise(r => setTimeout(r, 20));
    const r = analyse(text); lastResult = {r}; render(r); status(""); $("out").scrollIntoView({behavior: "smooth", block: "start"});
  } catch (e) { status(S[lang].fail + e.message); console.error(e); }
  finally { busy = false; $("go").disabled = false; }
}

$("go").onclick = () => run($("txt").value);
$("langBtn").onclick = () => { lang = lang === "en" ? "ar" : "en"; applyLang(); if ($("txt").value.trim() && lastResult) run($("txt").value); };
$("photo").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f || !py || busy) return;
  busy = true; $("go").disabled = true;
  try { const txt = await readPhoto(f); $("txt").value = txt; busy = false; await run(txt); }
  catch (err) { status(S[lang].fail + err.message); console.error(err); busy = false; $("go").disabled = false; }
};
applyLang();

<script>
(() => {
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const TIPS = {
    en: {stat: ["Everything you pay over the whole plan, fees included.", "What you pay on top of the cash price: profit and fees.", "The plan's yearly cost as a percentage. An upfront fee counts as money you do not receive.", "What you pay each month."],
         hf: "A fee written in the offer that you must pay to get the 0% price.", photo: "Upload or take a photo. Arabic and English are read inside your browser."},
    ar: {stat: ["كل ما تدفعه خلال الخطة كاملة، شاملاً الرسوم.", "ما تدفعه فوق السعر النقدي: الأرباح والرسوم.", "التكلفة السنوية للخطة كنسبة مئوية. الرسم المقدّم يُحتسب كمبلغ لا تستلمه.", "ما تدفعه كل شهر."],
         hf: "رسم مكتوب في العرض وعليك دفعه للحصول على سعر 0%.", photo: "ارفع صورة أو التقطها. تُقرأ العربية والإنجليزية داخل متصفحك."}
  };
  const tips = () => TIPS[document.documentElement.lang] || TIPS.en;
  function countUp(el) {
    const txt = el.textContent, m = /^(\+?)(\d[\d,]*(?:\.(\d+))?)(%?)$/.exec(txt);
    if (!m || still.matches) return;
    const end = parseFloat(m[2].replace(/,/g, "")), dec = m[3] ? m[3].length : 0, t0 = performance.now(), dur = 800;
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur), v = end * (1 - Math.pow(1 - k, 3));
      el.textContent = k < 1 ? m[1] + v.toLocaleString("en-US", {minimumFractionDigits: dec, maximumFractionDigits: dec}) + m[4] : txt;
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  function decorate() {
    const t = tips();
    document.querySelectorAll("#out .stat").forEach((el, i) => { if (t.stat[i]) { el.dataset.tip = t.stat[i]; el.tabIndex = 0; } countUp(el.querySelector("b")); });
    const hf = document.querySelector("#out .hf"); if (hf) { hf.dataset.tip = t.hf; hf.tabIndex = 0; }
  }
  const photo = () => { const l = document.getElementById("photoLbl"); if (l) l.dataset.tip = tips().photo; };
  new MutationObserver(decorate).observe(document.getElementById("out"), {childList: true});
  new MutationObserver(() => { photo(); decorate(); }).observe(document.documentElement, {attributes: true, attributeFilter: ["lang"]});
  photo();
})();
</script>

<script>
(function(){
  var h=document.querySelector(".hero");
  if(!h||matchMedia("(prefers-reduced-motion:reduce),(hover:none)").matches)return;
  var M=7,w=document.createElement("div");w.style.cssText="position:relative;z-index:2";
  h.parentNode.insertBefore(w,h);w.appendChild(h);
  w.addEventListener("pointermove",function(e){
    var r=w.getBoundingClientRect(),x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
    h.classList.add("tilt");
    h.style.setProperty("--ry",(-(x-.5)*2*M).toFixed(2)+"deg");
    h.style.setProperty("--rx",((y-.5)*2*M).toFixed(2)+"deg");
    h.style.setProperty("--s","1.02");
    h.style.setProperty("--gx",(x*100).toFixed(1)+"%");h.style.setProperty("--gy",(y*100).toFixed(1)+"%");h.style.setProperty("--ga","1");
  });
  w.addEventListener("pointerleave",function(){
    h.classList.remove("tilt");
    ["--rx","--ry"].forEach(function(k){h.style.setProperty(k,"0deg")});
    h.style.setProperty("--s","1");h.style.setProperty("--ga","0");
  });
})();
</script>
