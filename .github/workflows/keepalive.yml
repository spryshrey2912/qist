name: keep-alive
# Visits the free Render API every 10 minutes so it does not fall asleep (a cold start takes about a minute).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://qist-api.onrender.com/health
